<h2 i18n="@@listeLivres">Liste des Livres</h2>
<a routerLink="/books/new" i18n="@@ajouLivre">Ajouter un nouveau livre</a>

<ul>
  <li *ngFor="let book of books">
    <strong>{{ book.title }}</strong> – {{ book.author }}
    <button (click)="deleteBook(book.id ?? '')" i18n="@@btSupprimer">Supprimer</button>
    <button [routerLink]="['/books', book.id]" i18n="@@btModifier">Modifier</button>
  </li>
</ul>
